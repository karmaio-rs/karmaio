[package]
name = "karmaio"
description = "A modern, fast, share-nothing asynchronous runtime for Rust"
repository.workspace = true
documentation = "https://docs.rs/karmaio"
readme = "README.md"
authors.workspace = true
license.workspace = true

version.workspace = true
publish = ["crates-io"]

categories = ["asynchronous", "network-programming"]
keywords = ["io", "thread-per-core", "io-uring", "async", "futures"]

edition.workspace = true
rust-version.workspace = true

[features]
# Include nothing by default. Opt into subsystems you need, or enable `full` for the complete public API.
default = []

# Enable every optional subsystem.
full = ["fs", "macros", "net", "process", "signal", "bytes", "memmap2"]

# Asynchronous filesystem APIs (`karmaio::fs`) and path/file driver ops.
# On Windows, pulls in file-system Win32 APIs used by open/stat/path ops.
fs = ["windows-sys/Win32_Storage_FileSystem", "windows-sys/Win32_Security"]

# karmaio helper macros.
macros = ["dep:karmaio-macros"]

# TCP / UDP / Unix socket APIs (`karmaio::net`) and socket driver ops.
# Enables the `socket2` dependency.
net = ["dep:socket2"]

# Child process APIs (`karmaio::process`), stdio pipe I/O, and process-wait ops.
# On Windows, pipe read/write use the same file Win32 APIs as `fs`.
process = ["windows-sys/Win32_Storage_FileSystem"]

# OS signal / Ctrl-C handling (`karmaio::signal`).
# On Windows, enables console control handler APIs.
signal = ["windows-sys/Win32_System_Console"]

# `IoBuf` / `IoBufMut` impls for `bytes::{Bytes, BytesMut}`.
bytes = ["dep:bytes"]

# `IoBuf` / `IoBufMut` impls for `memmap2::{Mmap, MmapMut}`.
memmap2 = ["dep:memmap2"]

# Core dependencies. Cross Platform
[dependencies]
bytes = { version = "1", optional = true }
memmap2 = { version = "0.9.11", optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }

# Internal package dependeices for redistribution
karmaio-macros = { path = "../karmaio-macros", version = "=0.1.0-alpha.3", optional = true }

# Unix platform dependencies
[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.0.5", default-features = false, features = ["event", "fs", "net", "process", "std", "try_close"] }

# Linux platform dependencies
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.13"

# Windows platform dependencies
# Core IOCP / foundation features are always enabled. File-system completion
# configuration is also required by the IOCP driver itself; Console and Security
# remain activated by their respective crate features.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[[test]]
name = "test_attr"
required-features = ["macros"]

[[test]]
name = "framed_tcp"
required-features = ["macros", "net"]

[[test]]
name = "owned_split_contract"
required-features = ["net"]

[[test]]
name = "tcp_owned_split"
required-features = ["macros", "net"]

[[test]]
name = "tcp_cancel"
required-features = ["macros", "net"]

[[test]]
name = "udp_cancel"
required-features = ["macros", "net"]

[[test]]
name = "unix_owned_split"
required-features = ["macros", "net"]

[[test]]
name = "unix_cancel"
required-features = ["macros", "net"]

[[test]]
name = "accept_multi"
required-features = ["macros", "net"]

[[test]]
name = "recv_managed"
required-features = ["macros", "net"]

[[test]]
name = "recv_multi"
required-features = ["macros", "net"]

[[test]]
name = "recv_from_managed"
required-features = ["macros", "net"]

[[test]]
name = "fs"
required-features = ["fs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
