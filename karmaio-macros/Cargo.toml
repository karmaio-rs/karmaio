[package]
name = "karmaio-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Attribute macros for the karmaio runtime (proc-macro crate)"
license = "MIT OR Apache-2.0"
authors = ["Tarak Sharma <tarak@taraksharma.com>"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
