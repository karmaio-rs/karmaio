[package]
name = "karmaio-macros"
description = "Attribute macros for the karmaio runtime (proc-macro crate)"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/karmaio"
readme = "README.md"
publish = ["crates-io"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
